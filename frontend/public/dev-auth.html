<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Meetora — Dev Auth Helper</title>
    <style>
      body { font-family: system-ui, sans-serif; display:flex; align-items:center; justify-content:center; height:100vh; margin:0; background:#f7fbff }
      .card{background:white;border-radius:12px;padding:24px;box-shadow:0 8px 24px rgba(2,6,23,.08);max-width:420px;width:100%}
      button{display:block;width:100%;padding:12px;border-radius:8px;border:0;margin:8px 0;font-weight:600}
      .patient{background:#0b4fe0;color:white}
      .doctor{background:#06b6d4;color:white}
      .admin{background:#111827;color:white}
      .clear{background:#fff;border:1px solid #e5e7eb;color:#111827}
      label{display:block;margin-top:12px;font-size:13px;color:#374151}
      input{width:100%;padding:8px;border-radius:8px;border:1px solid #e5e7eb;margin-top:6px}
    </style>
  </head>
  <body>
    <div class="card">
      <h2>Dev auth helper</h2>
      <p style="color:#6b7280;margin-bottom:12px">Inject a test user into localStorage and go to the matching dashboard.</p>

      <label for="redirect">Redirect path (optional)</label>
      <input id="redirect" placeholder="/patient/dashboard" />

      <button class="patient" id="btn-patient">Inject Patient</button>
      <button class="doctor" id="btn-doctor">Inject Doctor</button>
      <button class="admin" id="btn-admin">Inject Admin</button>

      <button class="clear" id="btn-clear">Clear auth (logout)</button>

      <p style="font-size:13px;color:#9ca3af;margin-top:10px">meetora-auth is the key used by the app's persisted auth store.</p>
    </div>

    <script>
      const sample = {
        patient: {
          user: { id: 101, firstName: 'Alice', lastName: 'Martin', email: 'alice@example.com', role: 'patient', avatarUrl: 'https://i.pravatar.cc/150?u=alice101' },
          token: 'fake-token-123', isAuthenticated: true
        },
        doctor: {
          user: { id: 202, firstName: 'Omar', lastName: 'Haddad', email: 'omar@example.com', role: 'doctor', avatarUrl: 'https://i.pravatar.cc/150?u=omar202' },
          token: 'fake-token-456', isAuthenticated: true
        },
        admin: {
          user: { id: 1, firstName: 'Admin', lastName: 'User', email: 'admin@example.com', role: 'admin' },
          token: 'fake-token-admin', isAuthenticated: true
        }
      };

      function injectAndRedirect(kind){
        const redirect = (document.getElementById('redirect').value || (kind === 'patient' ? '/patient/dashboard' : kind === 'doctor' ? '/doctor/dashboard' : '/admin/dashboard'));
        localStorage.setItem('meetora-auth', JSON.stringify(sample[kind]));
        // small delay so storage updates are committed in some browsers
        setTimeout(() => { location.href = redirect; }, 150);
      }

      document.getElementById('btn-patient').addEventListener('click', () => injectAndRedirect('patient'));
      document.getElementById('btn-doctor').addEventListener('click', () => injectAndRedirect('doctor'));
      document.getElementById('btn-admin').addEventListener('click', () => injectAndRedirect('admin'));
      document.getElementById('btn-clear').addEventListener('click', () => { localStorage.removeItem('meetora-auth'); location.reload(); });
    </script>
  </body>
</html>
